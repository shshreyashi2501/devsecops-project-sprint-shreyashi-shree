name: DevSecOps Multi-Environment Pipeline

on:
  push:
    branches: ["main"]

jobs:

# ================= SECURITY =================
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Bandit
      run: pip install bandit

    - name: SAST Scan
      run: bandit -r app/

    - name: Install Safety
      run: pip install safety

    - name: Dependency Scan
      run: safety check

    - name: Secret Scan
      run: docker run --rm -v $PWD:/repo zricethezav/gitleaks detect --source=/repo

# ================= BUILD =================
  build:
    runs-on: ubuntu-latest
    needs: security

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t devsecops-app .

    - name: Save Image
      run: docker save devsecops-app > image.tar

    - uses: actions/upload-artifact@v4
      with:
        name: image
        path: image.tar

# ================= DEV =================
  dev:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: image

    - name: Load Image
      run: docker load < image.tar

    - name: Run DEV (5000)
      run: docker run -d -p 5000:5000 --name dev devsecops-app

# ================= STAGING =================
  staging:
    runs-on: ubuntu-latest
    needs: dev

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: image

    - name: Load Image
      run: docker load < image.tar

    - name: Run STAGING (5001)
      run: docker run -d -p 5001:5000 --name staging devsecops-app

# ================= PROD =================
  prod:
    runs-on: ubuntu-latest
    needs: staging

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: image

    - name: Load Image
      run: docker load < image.tar

    - name: Run PROD (5002)
      run: docker run -d -p 5002:5000 --name prod devsecops-app
